name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Compile
        run: |
          mkdir -p build/classes
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d build/classes
